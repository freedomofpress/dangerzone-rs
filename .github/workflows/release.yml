name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

# Never cancel a release that is being published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Release builds don't use a cache, so that a poisoned cache from another
  # workflow can't end up in the published binaries.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # to check out the code
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dangerzone-rs
            asset_name: dangerzone-rs-linux-x86_64

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: dangerzone-rs
            asset_name: dangerzone-rs-linux-aarch64
            use_cross: true

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: dangerzone-rs
            asset_name: dangerzone-rs-macos-x86_64

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dangerzone-rs
            asset_name: dangerzone-rs-macos-aarch64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: dangerzone-rs.exe
            asset_name: dangerzone-rs-windows-x86_64.exe

    env:
      TARGET: ${{ matrix.target }}
      ARTIFACT_NAME: ${{ matrix.artifact_name }}
      ASSET_NAME: ${{ matrix.asset_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build binary (using cross)
        if: matrix.use_cross
        run: cross build --locked --release --target "$TARGET"

      - name: Build binary (using cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Strip binary (Linux and macOS only)
        if: ${{ !matrix.use_cross && runner.os != 'Windows' }}
        run: strip "target/$TARGET/release/$ARTIFACT_NAME"

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/$TARGET/release/$ARTIFACT_NAME" "release/$ASSET_NAME"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}
          if-no-files-found: error

  # Only this job can write to the repository, and it doesn't build anything.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and upload its assets
    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: Compute checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS

      # Create the release unless it exists already, e.g. as a draft.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG"
          gh release upload "$TAG" release/* --clobber
