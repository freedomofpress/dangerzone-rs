name: CI

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  zizmor:
    name: Audit GitHub workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the code
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      with:
        advanced-security: false
        version: 1.31.1

  cargo-deny:
    name: Audit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the code
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Run cargo-deny
      uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      with:
        command: check advisories bans licenses sources

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the code
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt,clippy
        rustup default stable

    - name: Cache cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-lint-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-lint-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    # The lints themselves are configured in Cargo.toml and clippy.toml.
    - name: Run clippy (default features)
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Run clippy (no default features)
      run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

    - name: Check documentation
      run: cargo doc --locked --no-deps --all-features
      env:
        RUSTDOCFLAGS: -D warnings

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # to check out the code

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Cache cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build project
      run: cargo build --locked --release

    - name: Run tests
      run: cargo test --locked --all-targets

    # `--all-targets` does not include doctests.
    - name: Run doctests
      run: cargo test --locked --doc
