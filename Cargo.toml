[package]
name = "dangerzone-rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Freedom of the Press Foundation <info@freedom.press>"]
description = "Convert potentially dangerous documents into safe PDFs"
homepage = "https://dangerzone.rocks"
repository = "https://github.com/freedomofpress/dangerzone-rs"
readme = "README.md"
keywords = ["dangerzone", "sanitization", "pdf", "security", "document"]
categories = ["command-line-utilities", "multimedia::images", "text-processing"]

[[bin]]
name = "dangerzone-rs"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = "1.0.103"
flate2 = "1.0"
unicode-general-category = "1.1.0"
kreuzberg-tesseract = { version = "4.9", default-features = false, features = ["static-linking"] }
rayon = "1.8"

[dev-dependencies]
tempfile = "3.8"
walkdir = "2.4"
