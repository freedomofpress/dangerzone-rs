[package]
name = "dangerzone-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dangerzone-rs"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = "1.0.103"
flate2 = "1.0"
unicode-general-category = "1.1.0"
kreuzberg-tesseract = { version = "4.9", default-features = false, features = ["static-linking"] }
rayon = "1.8"

[dev-dependencies]
tempfile = "3.8"
walkdir = "2.4"
