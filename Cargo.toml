[package]
name = "dangerzone-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "dangerzone_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dangerzone-rs"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]
python = ["dep:pyo3"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0.103", optional = true }
flate2 = "1.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
unicode-general-category = "1.1.0"
xberg-tesseract = { version = "1.3", default-features = false, features = ["static-linking", "bundle-tessdata-eng"] }
rayon = "1.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3.8"
testresult = "0.4"
walkdir = "2.4"
